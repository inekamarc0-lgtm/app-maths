<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>MathPad — Brouillon Mathématique Propre</title>
<style>
  :root {
    --bg-app: #0f1115;
    --bg-card: #181b21;
    --bg-input: #22262f;
    --bg-toolbar: #1c2028;
    --border: #2e3440;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #10b981;
    --danger: #ef4444;
    --connector: #38bdf8;
    --math-size: 20px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-math: "Cambria Math", "Times New Roman", Times, serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0; padding: 0; background-color: var(--bg-app); color: var(--text-main);
    font-family: var(--font-sans); display: flex; flex-direction: column;
    height: 100%; height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* --- HEADER --- */
  header {
    position: relative; z-index: 30; background-color: var(--bg-card); border-bottom: 1px solid var(--border);
    padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .title-group { display: flex; align-items: center; flex: 1; min-width: 0; margin-right: 8px; }
  #exo-title {
    background: transparent; border: 1px solid transparent; color: var(--text-main); font-family: inherit;
    font-size: 0.8rem; font-weight: 600; padding: 3px 6px; border-radius: 6px; width: 100%;
  }
  #exo-title:focus { outline: none; background: var(--bg-input); border-color: var(--accent); }

  .icon-btn {
    background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
    padding: 7px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .menu-wrap { position: relative; flex-shrink: 0; }
  #menu-btn { padding: 3px 11px; font-size: 1.05rem; line-height: 1.3; }
  .menu-panel {
    position: absolute; right: 0; top: calc(100% + 8px); min-width: 250px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.55);
    padding: 6px; display: flex; flex-direction: column;
  }
  .menu-panel[hidden] { display: none; }
  .menu-item {
    background: transparent; border: none; color: var(--text-main); text-align: left; padding: 10px 12px;
    border-radius: 8px; font-size: .9rem; font-family: inherit; cursor: pointer;
  }
  .menu-item:hover, .menu-item:active { background: var(--bg-input); }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
  .menu-size { padding: 8px 12px 10px; }
  .menu-size-title { font-size: .78rem; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .menu-size-row { display: flex; align-items: center; }
  .menu-size-row > * + * { margin-left: 8px; }
  .menu-size-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .menu-size-row .icon-btn { padding: 3px 9px; }

  /* --- WORKSPACE --- */
  #workspace {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 10px 40px 10px;
  }
  #steps-list { display: flex; flex-direction: column; padding-top: 6px; }
  /* Lignes sans cadre : aucun carré visible */
  .step-row { display: flex; align-items: center; padding: 0; margin: 0; background: none; border: none; }
  .step-num { flex: 0 0 1.7em; font-size: .72rem; font-weight: 700; color: var(--accent); user-select: none; }
  .step-content { flex: 1; min-width: 0; }
  .step-row.active .step-input { color: #cbd5e1; }

  .step-input {
    width: 100%; background: transparent; border: none; color: var(--text-main);
    font-family: monospace; font-size: calc(var(--math-size) * 0.85); padding: 1px 0; outline: none;
  }
  .step-rendered, .step-preview {
    font-family: var(--font-math); font-size: var(--math-size); line-height: 1.6;
    color: var(--text-main); word-break: break-word;
  }
  .step-rendered { cursor: pointer; min-height: 1.4em; display: block; }
  .step-rendered.empty-placeholder { color: var(--text-muted); font-family: var(--font-sans); font-size: 0.9rem; font-style: italic; }
  .step-preview { margin-top: 2px; padding-top: 2px; border-top: 1px dashed var(--border); }
  .step-preview:empty { display: none; }
  .step-rendered i, .step-preview i { font-style: italic; }

  /* Éléments mathématiques */
  .op.bin { margin: 0 .22em; }
  .op.rel { margin: 0 .32em; }
  .op.un { margin: 0 .05em 0 .1em; }
  .fn { margin-right: .12em; }
  .big { font-size: 1.35em; vertical-align: -0.1em; }
  .tx { white-space: pre-wrap; }
  .tx.b, .mb { font-weight: 700; }
  .it { font-style: italic; }
  .ov { border-top: 1.3px solid currentColor; }
  .ul { border-bottom: 1.3px solid currentColor; }
  .boxed { border: 1px solid currentColor; padding: 0 .3em; }
  .acc { position: relative; display: inline-block; }
  .acc::before { content: attr(data-a); position: absolute; left: 0; right: 0; top: -.55em; text-align: center; font-size: .8em; line-height: 1; }
  .acc.hat::before {
    content: ''; left: .05em; right: .05em; top: -.2em; height: .34em; font-size: inherit;
    background:
      linear-gradient(to top left, transparent calc(50% - .75px), currentColor calc(50% - .75px), currentColor calc(50% + .75px), transparent calc(50% + .75px)) left / 50% 100% no-repeat,
      linear-gradient(to top right, transparent calc(50% - .75px), currentColor calc(50% - .75px), currentColor calc(50% + .75px), transparent calc(50% + .75px)) right / 50% 100% no-repeat;
  }
  .ph { display: inline-block; min-width: .6em; height: .8em; border: 1px dashed var(--text-muted); border-radius: 2px; vertical-align: middle; }
  .ss { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: .72em; line-height: 1.15; }

  .math-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .2em; line-height: 1.3; }
  .math-frac .math-frac { font-size: .85em; }
  .math-num { border-bottom: 1.5px solid currentColor; padding: 0 .3em .05em .3em; text-align: center; }
  .math-den { padding: .05em .3em 0 .3em; text-align: center; }
  .binom .math-num { border-bottom: none; }
  sup, sub { font-size: .72em; line-height: 0; }
  sup { vertical-align: super; }
  sub { vertical-align: sub; }
  .math-sqrt { display: inline-flex; align-items: stretch; }
  .math-sqrt-rad { border-top: 1.3px solid currentColor; padding: 0 .15em; margin-left: 1px; }
  .rt-idx { align-self: flex-start; margin-right: -.2em; }

  #toolbar-container {
    background-color: var(--bg-toolbar); border-top: 1px solid var(--border);
    padding: 8px; display: flex; flex-direction: column; flex-shrink: 0; z-index: 20;
  }
  .toolbar-row { display: flex; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-bottom: 7px; }
  .toolbar-row::-webkit-scrollbar { display: none; }
  .toolbar-row > * + * { margin-left: 6px; }
  .tool-btn {
    background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
    border-radius: 8px; padding: 8px 11px; font-size: 0.95rem; white-space: nowrap; cursor: pointer; flex-shrink: 0;
    font-family: inherit;
  }
  .tool-btn.conn { color: var(--connector); background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.25); }
  .tool-btn.conn.selected { background: var(--connector); color: #0f1115; }

  .action-bar { display: flex; }
  .action-bar > * + * { margin-left: 8px; }
  .btn-dup, .btn-next {
    border-radius: 9px; padding: 10px 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 0.95rem;
  }
  .btn-dup > * + *, .btn-next > * + * { margin-left: 5px; }
  .btn-dup { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); flex: 1; }
  .btn-next { background: var(--accent); border: none; color: #fff; flex: 1.6; font-weight: 700; }

  /* --- MODAL --- */
  .modal-backdrop {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 460px; max-height: 85vh; max-height: 85dvh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-header, .modal-footer { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .modal-header { border-bottom: 1px solid var(--border); font-weight: 600; }
  .modal-footer { border-top: 1px solid var(--border); flex-wrap: wrap; }
  .modal-footer > * { margin: 3px 4px 3px 0; }
  .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; }
  .modal-body > * + * { margin-top: 10px; }

  .saved-item { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
  .saved-info { flex: 1; cursor: pointer; min-width: 0; }
  .saved-title { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-meta { font-size: 0.78rem; color: var(--text-muted); }

  .status-toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--success); color: #06281e;
    font-weight: 600; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 200;
  }
  .status-toast.show { opacity: 1; }

  #print-header { display: none; }

  @media print {
    html, body { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; color: #000 !important; }
    header, .step-preview, #toolbar-container, .del-step-btn, .modal-backdrop, .status-toast { display: none !important; }
    #print-header { display: block !important; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 18px; }
    #workspace { padding: 0 !important; overflow: visible !important; display: block !important; }
    .step-row { background: transparent !important; border: none !important; border-bottom: 1px solid #e5e7eb !important; box-shadow: none !important; padding: 8px 4px !important; page-break-inside: avoid; }
    .step-rendered, .step-input, .step-num { color: #000 !important; }
    .step-connector { color: #000 !important; }
  }
</style>
</head>
<body>

<div id="status-toast" class="status-toast">Enregistré</div>

<header>
  <div class="title-group">
    <input type="text" id="exo-title" value="Exercice 1" aria-label="Titre de l'exercice">
  </div>
  <div class="menu-wrap">
    <button type="button" class="icon-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">☰</button>
    <div class="menu-panel" id="menu-panel" hidden>
      <button type="button" class="menu-item" id="btn-new">＋ Nouvel exercice</button>
      <button type="button" class="menu-item" id="btn-library">📂 Dossiers</button>
      <button type="button" class="menu-item" id="btn-pdf">📄 Exporter en PDF</button>
      <div class="menu-sep"></div>
      <div class="menu-size">
        <div class="menu-size-title"><span>Taille du texte</span><span id="font-label">20 px</span></div>
        <div class="menu-size-row">
          <button type="button" class="icon-btn" id="font-minus" aria-label="Réduire la police">A−</button>
          <input type="range" id="font-range" min="6" max="44" step="1" value="20" aria-label="Taille du texte">
          <button type="button" class="icon-btn" id="font-plus" aria-label="Agrandir la police">A+</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="workspace">
  <div id="print-header">
    <h2 id="print-title" style="margin:0;">Exercice 1</h2>
    <small id="print-date" style="color:#555;"></small>
  </div>
  <div id="steps-list"></div>
</div>

<div id="toolbar-container">
  <div class="toolbar-row">
    <button type="button" class="tool-btn" data-action="insert" data-val=" ⇔ ">⇔</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" ⇒ ">⇒</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" → ">→</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="()">( )</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="[]">[ ]</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="«»">« »</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" = ">=</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" + ">+</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" - ">−</button>
  </div>
  <div class="toolbar-row">
    <button type="button" class="tool-btn" data-action="insert" data-val="^2">x²</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="^3">x³</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="^">xⁿ</button>
    <button type="button" class="tool-btn" data-action="frac">a/b</button>
    <button type="button" class="tool-btn" data-action="sqrt">√</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" * ">×</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" <= ">≤</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" >= ">≥</button>
    <button type="button" class="tool-btn" data-action="insert" data-val=" != ">≠</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="pi">π</button>
    <button type="button" class="tool-btn" data-action="insert" data-val="inf">∞</button>
  </div>
  <div class="toolbar-row">
    <button type="button" class="tool-btn" data-action="wrap" data-val="sin">sin</button>
    <button type="button" class="tool-btn" data-action="wrap" data-val="cos">cos</button>
    <button type="button" class="tool-btn" data-action="wrap" data-val="tan">tan</button>
    <button type="button" class="tool-btn" data-action="wrap" data-val="hat" aria-label="Angle (chapeau)">Â</button>
  </div>
  <div class="action-bar">
    <button type="button" class="btn-dup" id="btn-dup"><span>Dupliquer</span><span>↓</span></button>
    <button type="button" class="btn-dup" id="btn-mark"><span>N° partie</span></button>
    <button type="button" class="btn-next" id="btn-copy"><span>Tout copier</span></button>
  </div>
</div>

<div id="library-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span>Mes Exercices (JSON)</span>
      <button type="button" class="icon-btn" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="saved-list"></div>
    <div class="modal-footer">
      <button type="button" class="icon-btn primary" id="modal-save-arch">💾 Archiver</button>
      <button type="button" class="icon-btn" id="modal-dl-json">⬇ Exporter JSON</button>
      <label class="icon-btn" style="cursor:pointer;">
        ⬆ Importer JSON
        <input type="file" id="json-import" accept=".json,application/json" style="display:none;">
      </label>
    </div>
  </div>
</div>

<script>
  /* ==========================================================================
     1. MOTEUR MATHÉMATIQUE : syntaxe simple + LaTeX  ->  HTML
     ========================================================================== */
  var MathEngine = (function () {
    function table(s) {
      var o = {};
      s.split(' ').forEach(function (p) { var i = p.indexOf(':'); o[p.slice(0, i)] = p.slice(i + 1); });
      return o;
    }
    function set(s) { var o = {}; s.split(' ').forEach(function (c) { o[c] = 1; }); return o; }

    var REL = set('= ≠ ≤ ≥ < > ⇒ ⇔ → ← ⇐ ≈ ≡ ∼ ∈ ∉ ⊂ ⊆ ↦ ∝ ∥ ⊥ ≪ ≫ ⟶ ⟹ ⟺ ↔');
    var BIN = set('+ − × ÷ ⋅ ± ∓ ∪ ∩ ∧ ∨ ∘ ⋆ ∖');

    var CMD_OP = table('times:× div:÷ cdot:⋅ pm:± mp:∓ leq:≤ le:≤ geq:≥ ge:≥ neq:≠ ne:≠ approx:≈ equiv:≡ sim:∼ to:→ rightarrow:→ longrightarrow:⟶ leftarrow:← Rightarrow:⇒ implies:⇒ Longrightarrow:⟹ Leftrightarrow:⇔ iff:⇔ Longleftrightarrow:⟺ Leftarrow:⇐ leftrightarrow:↔ mapsto:↦ in:∈ notin:∉ subset:⊂ subseteq:⊆ cup:∪ cap:∩ land:∧ wedge:∧ lor:∨ vee:∨ propto:∝ parallel:∥ perp:⊥ circ:∘ ll:≪ gg:≫ setminus:∖ star:⋆ lt:< gt:> ast:×');
    var CMD_ATOM = table('infty:∞ partial:∂ nabla:∇ emptyset:∅ varnothing:∅ angle:∠ hbar:ℏ ell:ℓ aleph:ℵ degree:° triangle:△ therefore:∴ because:∵ neg:¬ lnot:¬ forall:∀ exists:∃ Re:ℜ Im:ℑ');
    var CMD_SYM = {
      ldots: '…', cdots: '⋯', dots: '…', vdots: '⋮', ddots: '⋱', prime: '′',
      '%': '%', '$': '$', '&': '&', '#': '#', '_': '_', '{': '{', '}': '}', '|': '‖',
      ',': ' ', ';': ' ', ':': ' ', '!': '', ' ': ' ', quad: ' ', qquad: '  ',
      langle: '⟨', rangle: '⟩', lfloor: '⌊', rfloor: '⌋', lceil: '⌈', rceil: '⌉',
      vert: '|', lvert: '|', rvert: '|', Vert: '‖', lVert: '‖', rVert: '‖', backslash: '\\'
    };
    var BIG = table('sum:∑ prod:∏ int:∫ iint:∬ iiint:∭ oint:∮ bigcup:⋃ bigcap:⋂ coprod:∐');
    var GREEK_L = table('alpha:α beta:β gamma:γ delta:δ epsilon:ε varepsilon:ε zeta:ζ eta:η theta:θ vartheta:ϑ iota:ι kappa:κ lambda:λ mu:μ nu:ν xi:ξ pi:π varpi:ϖ rho:ρ varrho:ϱ sigma:σ varsigma:ς tau:τ upsilon:υ phi:φ varphi:φ chi:χ psi:ψ omega:ω');
    var GREEK_U = table('Gamma:Γ Delta:Δ Theta:Θ Lambda:Λ Xi:Ξ Pi:Π Sigma:Σ Upsilon:Υ Phi:Φ Psi:Ψ Omega:Ω');
    var NATIVE_L = set('alpha beta gamma delta epsilon theta lambda sigma omega phi rho tau');
    var NATIVE_U = set('Gamma Delta Theta Lambda Sigma Phi Psi Omega');
    var FUNC = set('sin cos tan cot sec csc arcsin arccos arctan sinh cosh tanh coth ln log lg exp lim liminf limsup min max det dim ker gcd sup deg arg mod');
    var WORD_PREFIX = ['arcsin', 'arccos', 'arctan', 'sinh', 'cosh', 'tanh', 'sin', 'cos', 'tan', 'cot', 'sec', 'csc', 'ln', 'log', 'lim', 'exp'];
    var ACC = table('hat:^ tilde:~ vec:→ dot:˙ ddot:¨ widehat:^ widetilde:~ overrightarrow:→');
    var BB = { R: 'ℝ', N: 'ℕ', Z: 'ℤ', Q: 'ℚ', C: 'ℂ', P: 'ℙ', H: 'ℍ' };
    var RAW_TEXT = set('text textrm textbf textit mbox mathrm operatorname mathsf mathtt');
    var NOOP = set('displaystyle textstyle scriptstyle limits nolimits nonumber notag hline');
    var TEXTWORD = set('Donc donc Or Car car Alors alors');
    var DELIM = set('left right big Big bigg Bigg bigl bigr Bigl Bigr biggl biggr Biggl Biggr');

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    /* ---------- 1. Analyse lexicale ---------- */
    function lexOne(src, i, t) {
      var c = src.charAt(i), rest = src.slice(i), m;

      if (/\s/.test(c)) { m = /^\s+/.exec(rest); t.push({ k: 'ws' }); return i + m[0].length; }

      if (c === '\\') {
        m = /^\\([A-Za-z]+)/.exec(rest);
        if (m) { t.push({ k: 'cmd', v: m[1] }); return i + m[0].length; }
        var d = src.charAt(i + 1);
        if (d === '(' || d === ')' || d === '[' || d === ']') return i + 2;   // délimiteurs \( \) \[ \]
        if (d === '\\') { t.push({ k: 'br' }); return i + 2; }
        if (d) { t.push({ k: 'cmd', v: d }); return i + 2; }
        return i + 1;
      }
      if (c === '$') return i + 1;
      if (c === '"' || c === '«') {
        var endCh = c === '"' ? '"' : '»';
        var j = src.indexOf(endCh, i + 1); if (j < 0) j = src.length;
        t.push({ k: 'text', v: src.slice(i + 1, j) });
        return j + 1;
      }
      if (c === '√') { t.push({ k: 'cmd', v: 'sqrt' }); return i + 1; }

      m = /^\d+(?:[.,]\d+)?/.exec(rest);
      if (m) { t.push({ k: 'num', v: m[0] }); return i + m[0].length; }

      if (/[A-Za-z]/.test(c)) {
        var w = /^[A-Za-z]+/.exec(rest)[0], lw = w.toLowerCase();
        if (w === 'sqrt') t.push({ k: 'cmd', v: 'sqrt' });
        else if (w === 'hat') t.push({ k: 'cmd', v: 'widehat' });
        else if (TEXTWORD[w]) t.push({ k: 'text', v: w });
        else if (lw === 'pi') t.push({ k: 'var', v: 'π' });
        else if (lw === 'inf') t.push({ k: 'atom', v: '∞' });
        else if (NATIVE_L[w]) t.push({ k: 'var', v: GREEK_L[w] });
        else if (NATIVE_U[w]) t.push({ k: 'var', v: GREEK_U[w], up: true });
        else if (FUNC[w]) t.push({ k: 'func', v: w });
        else {
          var f = null;

          if (!txt) return;
          e.preventDefault();
          pasteInto(idx, input, txt);
        });

        // Fermeture automatique des ( ) [ ] { } « »
        input.addEventListener('beforeinput', function (e) {
          var el = e.target;
          var s = el.selectionStart, en = el.selectionEnd;
          if (s == null || en == null) return;

          // Saisie d'un symbole ouvrant avec du texte sélectionné : on entoure la sélection
          if (e.inputType === 'insertText' && e.data && AUTO_PAIRS[e.data] && s !== en) {
            e.preventDefault();
            var sel = el.value.slice(s, en);
            el.value = el.value.slice(0, s) + e.data + sel + AUTO_PAIRS[e.data] + el.value.slice(en);
            el.setSelectionRange(s + 1, s + 1 + sel.length);
            syncInput(idx, el);
            return;
          }

          // Retour arrière entre deux symboles appariés "(|)" : on supprime les deux
          if (e.inputType === 'deleteContentBackward' && s === en && s > 0) {
            var before = el.value.charAt(s - 1);
            var after = el.value.charAt(s);
            if (AUTO_PAIRS[before] && AUTO_PAIRS[before] === after) {
              e.preventDefault();
              el.value = el.value.slice(0, s - 1) + el.value.slice(s + 1);
              el.setSelectionRange(s - 1, s - 1);
              syncInput(idx, el);
            }
          }
        });

        input.addEventListener('input', function (e) {
          var el = e.target;
          if (e.inputType === 'insertText' && e.data && e.data.length === 1) {
            var pos = el.selectionStart;
            var typed = e.data;
            if (pos != null && pos === el.selectionEnd) {
              if (AUTO_PAIRS[typed]) {
                // Symbole ouvrant : on ajoute le fermant juste après le curseur
                el.value = el.value.slice(0, pos) + AUTO_PAIRS[typed] + el.value.slice(pos);
                el.setSelectionRange(pos, pos);
              } else if (AUTO_CLOSERS.indexOf(typed) !== -1 && el.value.charAt(pos) === typed) {
                // Symbole fermant déjà présent juste après : on le "saute" au lieu de le doubler
                el.value = el.value.slice(0, pos) + el.value.slice(pos + 1);
                el.setSelectionRange(pos, pos);
              }
            }
          }
          syncInput(idx, el);
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            validateAndNext(false);
          }
        });

        content.appendChild(input);

        var preview = document.createElement('div');
        preview.className = 'step-preview';
        preview.id = 'step-preview-' + idx;
        preview.innerHTML = safeFormat(step.raw);
        content.appendChild(preview);
      } else {
        var rendered = document.createElement('div');
        rendered.className = 'step-rendered';
        if (!step.raw.trim()) {
          rendered.classList.add('empty-placeholder');
          rendered.textContent = 'Appuyer pour écrire...';
        } else {
          rendered.innerHTML = safeFormat(step.raw);
        }
        rendered.addEventListener('click', function (e) {
          e.stopPropagation();
          setActive(idx);
          StorageService.saveCurrent(state);
          render();
        });
        content.appendChild(rendered);
      }

      row.appendChild(content);

      if (state.steps.length > 1 && idx === state.activeIndex) {
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'del-step-btn';
        delBtn.textContent = '✕';
        delBtn.setAttribute('aria-label', 'Supprimer la ligne');
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          state.steps.splice(idx, 1);
          var a = state.activeIndex;
          if (idx < a) a--;
          if (a >= state.steps.length) a = state.steps.length - 1;
          if (a < 0) a = 0;
          setActive(a);
          StorageService.saveCurrent(state);
          render();
        });
        row.appendChild(delBtn);
      }

      container.appendChild(row);
    });

    updateConnectorsUI();

    var activeInput = document.getElementById('step-input-' + state.activeIndex);
    if (activeInput) {
      activeInput.focus();
      var len = activeInput.value.length;
      try { activeInput.setSelectionRange(len, len); } catch (e) {}
    }
  }

  // Cliquer sur le fond de l'espace de travail réveille le clavier sur la ligne active
  document.getElementById('workspace').addEventListener('click', function (e) {
    if (e.target.id === 'workspace' || e.target.id === 'steps-list') {
      var activeInput = document.getElementById('step-input-' + state.activeIndex);
      if (activeInput) activeInput.focus();
    }
  });

  function updateConnectorsUI() {
    var st = state.steps[state.activeIndex];
    var curConn = st ? st.connector : '';
    document.querySelectorAll('.tool-btn.conn').forEach(function (btn) {
      btn.classList.toggle('selected', btn.dataset.conn === curConn);
    });
  }

  function validateAndNext(duplicate) {
    var curr = state.activeIndex;
    if (curr < 0 || curr >= state.steps.length) curr = state.steps.length - 1;
    state.steps[curr].editing = false;
    var newStep = {
      raw: duplicate ? state.steps[curr].raw : '',
      editing: true
    };
    state.steps.splice(curr + 1, 0, newStep);
    setActive(curr + 1);
    StorageService.saveCurrent(state);
    render();
    var ws = document.getElementById('workspace');
    setTimeout(function () {
      try { ws.scrollTo({ top: ws.scrollHeight, behavior: 'smooth' }); }
      catch (e) { ws.scrollTop = ws.scrollHeight; }
    }, 30);
  }

  function getActiveInput() {
    return document.getElementById('step-input-' + state.activeIndex);
  }

  function insertToInput(text) {
    var input = getActiveInput();
    if (!input) return;
    var start = input.selectionStart == null ? input.value.length : input.selectionStart;
    var end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
    input.value = input.value.slice(0, start) + text + input.value.slice(end);
    state.steps[state.activeIndex].raw = input.value;
    var pos = /(\(\)|\[\]|«»)$/.test(text) ? start + text.length - 1 : start + text.length;
    input.focus();
    input.setSelectionRange(pos, pos);
    StorageService.saveCurrent(state);
    updatePreview(state.activeIndex);
  }

  function insertFracOrSqrt(type) {
    var input = getActiveInput();
    if (!input) return;
    var start = input.selectionStart == null ? input.value.length : input.selectionStart;
    var end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
    var sel = input.value.slice(start, end);
    var snippet, pos;
    if (type === 'frac') {
      snippet = sel ? '(' + sel + ')/()' : '()/()';
      pos = sel ? start + sel.length + 4 : start + 1;   // curseur dans le dénominateur / numérateur
    } else {
      snippet = sel ? 'sqrt(' + sel + ')' : 'sqrt()';
      pos = sel ? start + 5 + sel.length + 1 : start + 5;
    }
    input.value = input.value.slice(0, start) + snippet + input.value.slice(end);
    state.steps[state.activeIndex].raw = input.value;
    input.focus();
    input.setSelectionRange(pos, pos);
    StorageService.saveCurrent(state);
    updatePreview(state.activeIndex);
  }

  /* ==========================================================================
     4. ÉVÉNEMENTS
     ========================================================================== */

  // Empêche la barre d'outils de voler le focus (sinon le clavier se ferme à chaque clic)
  var toolbar = document.getElementById('toolbar-container');
  ['mousedown', 'pointerdown'].forEach(function (evt) {
    toolbar.addEventListener(evt, function (e) {
      if (e.target.closest && e.target.closest('button')) e.preventDefault();
    });
  });

  document.getElementById('exo-title').addEventListener('input', function (e) {
    state.title = e.target.value;
    StorageService.saveCurrent(state);
  });
  document.getElementById('exo-title').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); render(); }
  });

  document.getElementById('btn-new').addEventListener('click', function () {
    if (hasContent(state)) StorageService.saveArchive(state);
    state = {
      id: Date.now().toString(),
      title: 'Exercice ' + (StorageService.getArchive().length + 1),
      updatedAt: new Date().toISOString(),
      activeIndex: 0,
      steps: [{ raw: '', editing: true }]
    };
    StorageService.saveCurrent(state);
    render();
    showToast('Nouvelle feuille prête');
  });

  document.getElementById('btn-library').addEventListener('click', function () {
    if (hasContent(state)) StorageService.saveArchive(state);
    renderLibraryList();
    document.getElementById('library-modal').classList.add('open');
  });

  document.getElementById('modal-close').addEventListener('click', function () {
    document.getElementById('library-modal').classList.remove('open');
  });

  document.getElementById('library-modal').addEventListener('click', function (e) {
    if (e.target.id === 'library-modal') e.target.classList.remove('open');
  });

  document.getElementById('btn-pdf').addEventListener('click', function () {
    var prev = state.activeIndex;
    state.steps.forEach(function (s) { s.editing = false; });
    state.activeIndex = -1;
    render();
    document.getElementById('print-title').textContent = state.title || 'Exercice';
    document.getElementById('print-date').textContent = 'Généré le ' + new Date().toLocaleDateString('fr-FR');

    var restored = false;
    var restore = function () {
      if (restored) return;
      restored = true;
      window.removeEventListener('afterprint', restore);
      setActive(prev >= 0 && prev < state.steps.length ? prev : state.steps.length - 1);
      render();
    };
    window.addEventListener('afterprint', restore);
    setTimeout(function () { window.print(); }, 150);
  });

  document.getElementById('btn-dup').addEventListener('click', function () { validateAndNext(true); });

  document.querySelectorAll('.tool-btn.conn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var conn = btn.dataset.conn;
      var step = state.steps[state.activeIndex];
      if (!step) return;
      step.connector = (step.connector === conn) ? '' : conn;
      StorageService.saveCurrent(state);
      render();
    });
  });

  document.querySelectorAll('.tool-btn[data-action="insert"]').forEach(function (btn) {
    btn.addEventListener('click', function () { insertToInput(btn.dataset.val); });
  });
  document.querySelectorAll('.tool-btn[data-action="frac"]').forEach(function (btn) {
    btn.addEventListener('click', function () { insertFracOrSqrt('frac'); });
  });
  document.querySelectorAll('.tool-btn[data-action="wrap"]').forEach(function (btn) {
    btn.addEventListener('click', function () { insertWrap(btn.dataset.val); });
  });
  document.getElementById('btn-mark').addEventListener('click', toggleMark);
  document.getElementById('btn-copy').addEventListener('click', copyAll);
  document.querySelectorAll('.tool-btn[data-action="sqrt"]').forEach(function (btn) {
    btn.addEventListener('click', function () { insertFracOrSqrt('sqrt'); });
  });

  document.getElementById('modal-save-arch').addEventListener('click', function () {
    StorageService.saveArchive(state);
    showToast('Exercice archivé');
    renderLibraryList();
  });

  document.getElementById('modal-dl-json').addEventListener('click', function () {
    StorageService.saveArchive(state);
    var dataStr = JSON.stringify(StorageService.getArchive(), null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'mathpad_exercices_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('JSON téléchargé');
  });

  document.getElementById('json-import').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (evt) {
      var success = StorageService.importData(evt.target.result);
      if (success) {
        renderLibraryList();
        showToast('JSON importé avec succès');
      } else {
        alert('Fichier JSON invalide');
      }
    };
    reader.readAsText(file);
    e.target.value = '';   // permet de réimporter le même fichier
  });

  function renderLibraryList() {
    var list = document.getElementById('saved-list');
    var archive = StorageService.getArchive();
    list.innerHTML = '';
    if (archive.length === 0) {
      var empty = document.createElement('p');
      empty.style.cssText = 'color:var(--text-muted); text-align:center;';
      empty.textContent = 'Aucun exercice archivé.';
      list.appendChild(empty);
      return;
    }
    archive.forEach(function (exo) {
      var item = document.createElement('div');
      item.className = 'saved-item';

      var info = document.createElement('div');
      info.className = 'saved-info';
      var d = new Date(exo.updatedAt);
      var dateStr = isNaN(d.getTime()) ? '' : d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      var nSteps = Array.isArray(exo.steps) ? exo.steps.length : 0;

      var t = document.createElement('div');
      t.className = 'saved-title';
      t.textContent = exo.title || 'Sans titre';   // textContent : pas d'injection HTML
      var m = document.createElement('div');
      m.className = 'saved-meta';
      m.textContent = nSteps + ' ligne(s) • ' + dateStr;
      info.appendChild(t);
      info.appendChild(m);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'icon-btn';
      del.style.color = 'var(--danger)';
      del.textContent = '🗑';

      info.addEventListener('click', function () {
        var loaded = normalizeState(JSON.parse(JSON.stringify(exo)));
        if (!loaded) return;
        state = loaded;
        StorageService.saveCurrent(state);
        render();
        document.getElementById('library-modal').classList.remove('open');
        showToast('Exercice chargé');
      });
      del.addEventListener('click', function () {
        if (!confirm('Supprimer « ' + (exo.title || 'Sans titre') + ' » ?')) return;
        StorageService.deleteArchive(exo.id);
        renderLibraryList();
      });

      item.appendChild(info);
      item.appendChild(del);
      list.appendChild(item);
    });
  }

  // Insertion « nom(sélection) » : sin, cos, tan, hat (chapeau d'angle)
  function insertWrap(name) {
    var input = getActiveInput();
    if (!input) return;
    var start = input.selectionStart == null ? input.value.length : input.selectionStart;
    var end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
    var sel = input.value.slice(start, end);
    input.value = input.value.slice(0, start) + name + '(' + sel + ')' + input.value.slice(end);
    var pos = start + name.length + 1 + (sel ? sel.length + 1 : 0);
    state.steps[state.activeIndex].raw = input.value;
    input.focus();
    input.setSelectionRange(pos, pos);
    StorageService.saveCurrent(state);
    updatePreview(state.activeIndex);
  }

  // Numérotation d'une partie de l'exercice (la ligne 1 est toujours « 1 »)
  function toggleMark() {
    var i = state.activeIndex;
    if (i <= 0) { showToast('La ligne 1 est toujours numérotée'); return; }
    state.steps[i].mark = !state.steps[i].mark;
    StorageService.saveCurrent(state);
    render();
    showToast(state.steps[i].mark ? 'Ligne numérotée' : 'Numéro retiré');
  }

  // Tout copier
  function exportText() {
    var n = 0, lines = [];
    state.steps.forEach(function (s, i) {
      if (!s.raw.trim()) return;
      var label = '';
      if (i === 0) label = '1. ';
      else if (s.mark) { n++; label = (n + 1) + '. '; }
      lines.push(label + s.raw);
    });
    return lines.join('\n');
  }

  function copyAll() {
    var text = exportText();
    if (!text) { showToast('Rien à copier'); return; }
    var done = function () { showToast('Toutes les lignes copiées'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) {}
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) done(); else showToast('Copie impossible');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // Menu déroulant
  var menuBtn = document.getElementById('menu-btn');
  var menuPanel = document.getElementById('menu-panel');
  function setMenu(open) {
    menuPanel.hidden = !open;
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  menuBtn.addEventListener('click', function (e) { e.stopPropagation(); setMenu(menuPanel.hidden); });
  document.addEventListener('click', function (e) { if (!menuPanel.hidden && !menuPanel.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  ['btn-new', 'btn-library', 'btn-pdf'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function () { setMenu(false); });
  });

  // Taille de la police (toutes les lignes)
  var FONT_KEY = 'mathpad_font_size_v1';
  var fontRange = document.getElementById('font-range');
  function applyFont(px) {
    px = Math.max(6, Math.min(44, Math.round(px)));
    document.documentElement.style.setProperty('--math-size', px + 'px');
    fontRange.value = px;
    document.getElementById('font-label').textContent = px + ' px';
    lsSet(FONT_KEY, String(px));
  }
  var savedFont = parseInt(lsGet(FONT_KEY), 10);
  applyFont(savedFont >= 6 && savedFont <= 44 ? savedFont : 20);
  fontRange.addEventListener('input', function () { applyFont(parseInt(fontRange.value, 10)); });
  document.getElementById('font-minus').addEventListener('click', function () { applyFont(parseInt(fontRange.value, 10) - 2); });
  document.getElementById('font-plus').addEventListener('click', function () { applyFont(parseInt(fontRange.value, 10) + 2); });
  ['font-minus', 'font-plus'].forEach(function (id) {
    document.getElementById(id).addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  // Lancement initial
  render();

  // Mode hors ligne / installation (PWA)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
